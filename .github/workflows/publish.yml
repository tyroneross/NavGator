name: Publish packages

on:
  push:
    # release-please-config.json sets package-name "@tyroneross/navgator" with
    # include-v-in-tag, so release-please cuts `navgator-v<version>` tags -- it
    # dropped the bare `v<version>` format at v0.9.1. A `v*` filter therefore
    # matched nothing release-please creates, and this trigger was dead. The
    # release-please bridge dispatches this workflow explicitly, so the dead
    # trigger never surfaced; it would have surfaced the first time someone
    # pushed a release tag by hand and got no publish.
    tags:
      - 'navgator-v*'
  workflow_dispatch:

env:
  PUBLISH_NODE_VERSION: '24'
  CLAUDE_CODE_VERSION: '2.1.206'
  CODEX_CLI_VERSION: '0.130.0'
  DISABLE_AUTOUPDATER: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install web dependencies
        run: npm --prefix web ci --ignore-scripts

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm --prefix web audit --omit=dev --audit-level=moderate

      - name: Install pinned host CLIs
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@openai/codex@${CODEX_CLI_VERSION}"

      - name: Test full suite
        run: npm test

      - name: Typecheck root and web
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          EXPECTED_TAG="navgator-v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION (expected $EXPECTED_TAG)." >&2
            exit 1
          fi

      - name: Pack the verified artifact once
        id: artifact
        run: |
          # Pipe npm pack's JSON through stdin, not argv: the packed file list
          # (portable dashboard runtime) is large enough that passing it as a
          # command-line argument exceeds ARG_MAX ("Argument list too long").
          FILE=$(npm pack --json --ignore-scripts \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d)[0].filename))")
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Verify exact packed Claude and Codex artifact
        env:
          REQUIRE_CLAUDE_VALIDATION: '1'
          REQUIRE_CODEX_VALIDATION: '1'
          NAVGATOR_RELEASE_TARBALL: ${{ steps.artifact.outputs.file }}
        run: npm run verify:release

      - name: Hash verified artifact
        run: sha256sum "${{ steps.artifact.outputs.file }}" > "${{ steps.artifact.outputs.file }}.sha256"

      - name: Upload verified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: navgator-release
          path: |
            ${{ steps.artifact.outputs.file }}
            ${{ steps.artifact.outputs.file }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: navgator-release
          path: release

      - name: Verify artifact hash
        run: cd release && sha256sum -c *.sha256

      - name: Resolve artifact path
        id: artifact
        run: |
          # Absolute path so `npm publish` treats it as a FILE. A relative
          # `release/foo.tgz` is parsed as an <org>/<repo> git spec by
          # npm-package-arg and npm tries to `git ls-remote` it.
          FILE=$(find "$PWD/release" -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          # DELIBERATELY NO registry-url. Two claims in the comment that used to
          # sit here were wrong, and together they turned an auth failure into a
          # "the package does not exist" red herring:
          #
          # 1. registry-url is NOT required for the OIDC exchange. npm resolves
          #    the registry with `npmFetch.pickRegistry(resolved, opts)`
          #    (npm 11.19.0, lib/commands/publish.js:145-147), and the
          #    `--registry https://registry.npmjs.org` flag on the publish step
          #    below already sets opts.registry. The .npmrc plays no part.
          # 2. The placeholder token setup-node writes is NOT harmless. With
          #    registry-url set, setup-node writes
          #    `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and exports
          #    NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX. That is a NON-EMPTY
          #    credential, so publish.js's `noCreds` guard (line 150) passes and
          #    npm PUTs with a garbage token. npmjs answers E404 for an
          #    unauthorized write, which reads as "package missing" and buries
          #    the real fault.
          #
          # Without it, a failed OIDC exchange surfaces honestly as ENEEDAUTH,
          # and the diagnostic step below names why the exchange failed.
          # Provenance is unaffected either way: package.json sets
          # publishConfig.provenance, so npm signs regardless of OIDC. "Signed
          # provenance" is NOT evidence that trusted publishing authenticated.

      # Node 24's bundled npm (11.16.0) already satisfies trusted publishing
      # (needs >= 11.5.1) and ships sigstore for automatic provenance. A global
      # `npm install -g npm@latest` here produced a broken npm missing the
      # bundled `sigstore` module ("Cannot find module 'sigstore'"), so rely on
      # the pinned Node's npm instead.

      - name: Check npmjs version
        id: npmjs
        run: |
          if npm view "@tyroneross/navgator@${{ needs.build.outputs.version }}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose npm trusted-publisher binding
        # npm's OIDC helper swallows every exchange failure at log.verbose/silly
        # and returns undefined (npm 11.19.0, lib/utils/oidc.js), so a broken
        # trusted-publisher binding is invisible at the default loglevel. This
        # step makes the same two calls npm makes and prints what npmjs actually
        # answered, plus the exact claims npmjs matches the binding against.
        # Diagnostic only: it never uses the exchanged token to publish, and
        # never prints the id-token or the exchanged token.
        if: steps.npmjs.outputs.exists != 'true'
        continue-on-error: true
        env:
          NPM_PACKAGE: '@tyroneross/navgator'
        run: |
          set -uo pipefail
          ID_TOKEN=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write((JSON.parse(d).value)||''))")
          if [ -z "${ID_TOKEN}" ]; then
            echo "No GitHub OIDC id-token issued. Check that the job grants permissions.id-token: write."
            exit 0
          fi
          echo "Claims npmjs matches the trusted publisher against:"
          ID_TOKEN="${ID_TOKEN}" node -e '
            const p = JSON.parse(Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url").toString("utf8"));
            for (const k of ["repository", "repository_owner", "repository_visibility", "workflow_ref", "job_workflow_ref", "ref", "event_name"]) {
              console.log(`  ${k} = ${p[k]}`);
            }
          '
          # npm escapes the scope separator only, and lowercases the escape
          # (npm-package-arg escapedName): @scope%2fname, not %40scope%2Fname.
          ESCAPED="${NPM_PACKAGE/\//%2f}"
          echo "POST /-/npm/v1/oidc/token/exchange/package/${ESCAPED}"
          STATUS=$(curl -sS -o /tmp/npm-oidc-exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${ESCAPED}")
          echo "  HTTP ${STATUS}"
          if [ "${STATUS}" = "200" ]; then
            echo "  Exchange succeeded. The trusted-publisher binding is valid. (Token withheld from the log.)"
          else
            echo "  npmjs rejected the exchange. Response body:"
            sed -e 's/^/    /' /tmp/npm-oidc-exchange.json
            echo "  Fix at npmjs.com > @tyroneross/navgator > Settings > Trusted Publisher."
            echo "  Every field is case-sensitive and unvalidated; match the claims printed above."
          fi

      - name: Publish to npmjs (OIDC trusted publishing)
        # No NODE_AUTH_TOKEN: authentication is via the job's OIDC id-token
        # (permissions.id-token: write). npm >= 11.5.1 attaches provenance
        # automatically, so --provenance is not passed.
        if: steps.npmjs.outputs.exists != 'true'
        run: npm publish "${{ steps.artifact.outputs.file }}" --ignore-scripts --registry https://registry.npmjs.org --access public

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tyroneross'

      - name: Check GitHub Packages version
        id: github_packages
        run: |
          if npm view "@tyroneross/navgator@${{ needs.build.outputs.version }}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.github_packages.outputs.exists != 'true'
        run: npm publish "${{ steps.artifact.outputs.file }}" --ignore-scripts --registry https://npm.pkg.github.com --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
