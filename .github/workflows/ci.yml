name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'bl/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLAUDE_CODE_VERSION: '2.1.206'
  CODEX_CLI_VERSION: '0.130.0'
  DISABLE_AUTOUPDATER: '1'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.0', '22']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install web dependencies
        run: npm --prefix web ci --ignore-scripts

      # npm 10 (what Node 20 and 22 ship) posts to
      # /-/npm/v1/security/audits/quick, which npm RETIRED — it now answers
      # 400 Bad Request, so this step failed on infrastructure rather than on
      # any finding in this repo. npm 11 uses the bulk advisory endpoint the
      # retirement notice points at. Pinned rather than left to the Node
      # version, because the bundled npm is exactly what broke this.
      - name: Use npm 11 (the retired quick-audit endpoint answers 400)
        run: npm install -g npm@^11

      # `npm audit` exits non-zero for TWO unrelated reasons: it found
      # vulnerabilities, or it could not reach the advisory service. Treating
      # them the same makes this gate report on npm's uptime instead of on this
      # repo — observed 2026-09-04, when the bulk endpoint answered 503 and then
      # timed out, reddening main while nothing here had changed.
      #
      # A finding still FAILS. An unreachable service WARNS and continues, and
      # says so in the job summary, because a silent skip is how a security gate
      # rots unnoticed. The residual risk is explicit: during an npm outage this
      # push is not audited, and the next successful run audits it.
      - name: Audit production dependencies
        run: |
          set -uo pipefail
          audit_one() {
            local label="$1"; shift
            local out rc
            out="$("$@" --json 2>/dev/null)"; rc=$?
            if [ $rc -eq 0 ]; then echo "  $label: clean"; return 0; fi
            # A real result carries a vulnerability count; a service failure does not.
            if printf '%s' "$out" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{const j=JSON.parse(s);
                  const m=j.metadata&&j.metadata.vulnerabilities;
                  process.exit(m&&Object.values(m).some(n=>n>0)?0:1);
                }catch(e){process.exit(1);}});'; then
              echo "::error::$label: npm audit found vulnerabilities at or above moderate"
              printf '%s' "$out" | node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const j=JSON.parse(s);
                  console.log(JSON.stringify(j.metadata.vulnerabilities));});'
              return 1
            fi
            echo "::warning::$label: advisory service unreachable — NOT audited this run"
            echo "  $label: advisory service unreachable (not a finding, not a pass)" >> "$GITHUB_STEP_SUMMARY"
            return 0
          }
          rc=0
          audit_one "root" npm audit --omit=dev --audit-level=moderate || rc=1
          audit_one "web"  npm --prefix web audit --omit=dev --audit-level=moderate || rc=1
          exit $rc

      - name: Test full suite
        run: npm test

      - name: Typecheck root and web
        run: npm run typecheck

      - name: Build release payload
        run: npm run build

      # dist/ is committed on purpose (marketplace installs clone without
      # building), and `npm test` runs BEFORE this step against whatever dist
      # the commit shipped. So a change to src/cli/ that forgot to rebuild
      # would leave cli-exit-codes.test.ts asserting against a stale binary and
      # passing for the wrong reason — proven by mutation: three separate
      # src/cli mutations left that suite 15/15 green until dist was rebuilt.
      # This is the gate that makes the committed artifact match its source.
      - name: Assert committed dist matches source
        run: git diff --exit-code -- dist

      # ARCHITECTURE.md + docs/architecture/index.json are committed for the
      # same reason dist is: a fresh clone, and any agent dispatched into one,
      # must find the architecture without running a scan first. A committed
      # generated artifact rots silently, so it gets the same gate shape as
      # dist — regenerate, then fail on any difference. The generator is
      # deterministic by contract (no timestamps, no absolute paths, sorted
      # keys), asserted in src/__tests__/architecture-index.test.ts, so a diff
      # here always means real architecture change that was not committed.
      - name: Assert committed architecture index matches source
        run: |
          npm run architecture
          git diff --exit-code -- ARCHITECTURE.md docs/architecture

      - name: Verify packed Claude and Codex surfaces
        run: npm run verify:release

  host-verify:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # Same reason the verify job pins it: Node 22 ships npm 10, and npm 10's
      # arborist crashes here with "Cannot read properties of null (reading
      # 'edgesOut')" while install-plugin.sh installs the packed tarball. The
      # identical verify:release run passes on npm 11 locally. Relying on the
      # bundled npm is what broke this job and the audit step both.
      - name: Use npm 11 (npm 10 arborist crashes on this install)
        run: npm install -g npm@^11

      - name: Install project dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix web ci --ignore-scripts

      - name: Install pinned host CLIs
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@openai/codex@${CODEX_CLI_VERSION}"

      - name: Build release payload
        run: npm run build

      - name: Require live Claude and Codex lifecycle validation
        env:
          REQUIRE_CLAUDE_VALIDATION: '1'
          REQUIRE_CODEX_VALIDATION: '1'
        run: npm run verify:release
